[flake8]
max-line-length = 88
extend-ignore = E203, W503, E402
exclude =
    .git,
    __pycache__,
    .venv,
    venv,
    .github

[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short

[coverage:run]
source = app
omit =
    tests/*
    */__init__.py

