# GitHub Actions CI workflow
# 트리거: 모든 브랜치 push + main 대상 PR

name: CI — Test & Lint

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Pytest + Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: black (포맷 검사)
        run: black --check streamlit_app.py app/ tests/

      - name: flake8 (린트)
        run: flake8 streamlit_app.py app/ tests/ --count --show-source --statistics

      - name: pytest (단위 테스트 + 커버리지)
        run: pytest tests/ -v --tb=short --cov=app --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
